name: Event fader verification
on:
  push:
    branches: [main, feature/event-fader]
    paths:
      - 'app.js'
      - 'app.html'
      - 'backend.js'
      - 'audio-levels.js'
      - 'event-fader.js'
      - 'security-utils.js'
      - 'supabase/event_fader.sql'
      - 'tests/*fader*'
      - 'tests/audio-levels.test.mjs'
      - '.github/workflows/event-fader.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm test && npm run check && node --check audio-levels.js && node --check event-fader.js
      - name: Install browser driver
        run: npm install --prefix /tmp/harmony-browser --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: node /tmp/harmony-browser/node_modules/playwright/cli.js install chromium
      - name: Verify real audio crossfades
        timeout-minutes: 2
        run: node tests/verify-event-fader-browser.mjs /tmp/harmony-browser/node_modules/playwright
      - name: Verify existing playback controls
        timeout-minutes: 2
        run: node tests/verify-event-playback-browser.mjs /tmp/harmony-browser/node_modules/playwright
