name: Windows folder preparation verification
on:
  push:
    branches: [main, feature/access-audit]
    paths:
      - 'tools/pastas-windows/**'
      - 'tools/catalogo-windows/**'
      - 'downloads/Harmony-Gerar-Catalogo.zip'
      - 'downloads/Harmony-Preparar-Pastas.zip'
      - 'tests/windows/**'
      - '.github/workflows/folder-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify actual Windows folder renames and undo
        shell: powershell
        run: '& ./tests/windows/verify-folder-rename.ps1'
      - name: Verify the downloadable ZIP on Windows
        shell: powershell
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'harmony-download-test'
          Expand-Archive -LiteralPath ./downloads/Harmony-Preparar-Pastas.zip -DestinationPath $destination
          & ./tests/windows/verify-folder-rename.ps1 -ToolsRoot (Join-Path $destination 'Harmony-Preparar-Pastas')
      - name: Verify local file catalogue without reading or uploading audio
        shell: powershell
        run: '& ./tests/windows/verify-local-catalog.ps1'
      - name: Verify the distributed catalogue generator ZIP
        shell: powershell
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'harmony-catalog-test'
          Expand-Archive -LiteralPath ./downloads/Harmony-Gerar-Catalogo.zip -DestinationPath $destination
          & ./tests/windows/verify-local-catalog.ps1 -ToolsRoot (Join-Path $destination 'Harmony-Gerar-Catalogo')
