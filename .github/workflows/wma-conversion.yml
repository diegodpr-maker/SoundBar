name: WMA conversion verification
on:
  push:
    branches: [main, feature/wma-conversion, feature/playlist-batch-wake, feature/audio-file-limit]
    paths:
      - 'audio-conversion.js'
      - 'wma-worker.js'
      - 'library-batch.js'
      - 'resumable-upload.js'
      - 'upload-transfer.js'
      - 'backend.js'
      - 'tests/**'
      - '.github/workflows/wma-conversion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm test && npm run check
      - name: Load pinned browser conversion engine
        run: |
          curl --fail --retry 2 --max-time 120 -o /tmp/ffmpeg-core.cjs https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd/ffmpeg-core.js
          curl --fail --retry 2 --max-time 180 -o /tmp/ffmpeg-core.wasm https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd/ffmpeg-core.wasm
      - name: Convert actual WMA files and decode resulting MP3
        run: node tests/verify-wma-runtime.mjs /tmp/ffmpeg-core.cjs /tmp/ffmpeg-core.wasm
      - name: Verify actual browser worker and native playback under app CSP
        timeout-minutes: 3
        run: |
          npm install --prefix /tmp/harmony-browser --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node /tmp/harmony-browser/node_modules/playwright/cli.js install chromium
          node tests/verify-wma-browser.mjs /tmp/harmony-browser/node_modules/playwright
          node tests/verify-resumable-browser.mjs /tmp/harmony-browser/node_modules/playwright
