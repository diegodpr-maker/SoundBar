name: Account deletion verification
on:
  push:
    branches: [main, feature/account-deletion]
    paths:
      - 'app.js'
      - 'backend.js'
      - 'supabase/account_deletion.sql'
      - 'supabase/functions/delete-account/**'
      - 'tests/*account-deletion*'
      - 'tests/backend.test.mjs'
      - '.github/workflows/account-deletion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm test && npm run check && node --check supabase/functions/delete-account/core.js
      - name: Install browser driver
        run: npm install --prefix /tmp/harmony-browser --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: node /tmp/harmony-browser/node_modules/playwright/cli.js install chromium
      - name: Verify administrator account deletion
        timeout-minutes: 2
        run: node tests/verify-account-deletion-browser.mjs /tmp/harmony-browser/node_modules/playwright
