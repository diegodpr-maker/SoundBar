name: Event playback controls verification
on:
  push:
    branches: [main, feature/event-playback]
    paths:
      - 'app.js'
      - 'app.html'
      - 'playback-controls.js'
      - 'audio-pool.js'
      - 'style.css'
      - 'themes.css'
      - 'tests/audio-pool.test.mjs'
      - 'tests/playback-controls.test.mjs'
      - 'tests/verify-event-playback-browser.mjs'
      - '.github/workflows/event-playback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm test && npm run check && node --check playback-controls.js
      - name: Install browser driver
        run: npm install --prefix /tmp/harmony-browser --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: node /tmp/harmony-browser/node_modules/playwright/cli.js install chromium
      - name: Verify event playback with actual audio
        timeout-minutes: 2
        run: node tests/verify-event-playback-browser.mjs /tmp/harmony-browser/node_modules/playwright
