name: Inspect complete cPanel inventory
on:
  push:
    branches: [feature/access-audit]
    paths:
      - 'tools/cpanel/inspect-library.mjs'
      - '.github/workflows/cpanel-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Inspect all currently hosted categories without downloading full audio
        run: node tools/cpanel/inspect-library.mjs --all --confirm-duplicates
