name: Recover stalled Pages deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  cancel-stalled:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Cancel the fixed stalled Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          url = 'https://api.github.com/repos/diegodpr-maker/SoundBar/pages/deployments/e9c4ebf44be0de69700cddd1a44a1a923081ec8a'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def request(method, target):
              try:
                  with urllib.request.urlopen(urllib.request.Request(target, method=method, headers=headers), timeout=25) as response:
                      body = response.read()
                      data = json.loads(body) if body else {}
                      print(json.dumps({'method': method, 'http_status': response.status, 'deployment_status': data.get('status')}))
                      return response.status, data
              except urllib.error.HTTPError as error:
                  body = error.read()
                  print(json.dumps({'method': method, 'http_status': error.code, 'message': body.decode()[:500]}))
                  return error.code, {}
          before, state = request('GET', url)
          if before == 200 and state.get('status') == 'succeed':
              print('Deployment already succeeded; no cancellation needed.')
          else:
              code, _ = request('POST', url + '/cancel')
              if code not in (200, 202, 204, 404):
                  raise SystemExit('GitHub did not confirm cancellation')
              request('GET', url)
          PY
