name: Playlist order verification
on:
  push:
    branches: [main, feature/playlist-order]
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'supabase/playlist_positions.sql'
      - 'tests/*playlist*'
      - 'tests/*track-sort*'
      - '.github/workflows/playlist-order.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm test && npm run check && node --check track-sort.js && node --check playlist-order.js
      - name: Install browser driver
        run: npm install --prefix /tmp/harmony-browser --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: node /tmp/harmony-browser/node_modules/playwright/cli.js install chromium
      - name: Verify playlist ordering in the real app
        timeout-minutes: 2
        run: node tests/verify-playlist-order-browser.mjs /tmp/harmony-browser/node_modules/playwright
      - name: Verify existing music drag
        timeout-minutes: 2
        run: node tests/verify-track-sort-browser.mjs /tmp/harmony-browser/node_modules/playwright
