name: Configure verified Pages publishing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-setup.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Select GitHub Actions as the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          url = 'https://api.github.com/repos/diegodpr-maker/SoundBar/pages'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=25) as response:
              before = json.load(response)
          if before.get('build_type') != 'workflow':
              request = urllib.request.Request(url, method='PUT', headers=headers, data=json.dumps({'build_type': 'workflow'}).encode())
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      print('Pages source update:', response.status)
              except urllib.error.HTTPError as error:
                  print('GitHub refused the settings update:', error.code, error.read().decode()[:800])
                  raise SystemExit(1)
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=25) as response:
              after = json.load(response)
          assert after.get('build_type') == 'workflow', 'GitHub Actions source was not confirmed'
          assert after.get('cname') == before.get('cname'), 'Unexpected custom domain change'
          assert after.get('https_enforced') == before.get('https_enforced'), 'Unexpected HTTPS change'
          print('GitHub Actions source confirmed; domain and HTTPS preserved.')
          PY
