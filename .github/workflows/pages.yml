name: Verified Pages publication
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify-release.yml
  build:
    needs: [verify]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Require the GitHub Actions publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          if [ "$source_type" != workflow ]; then
            echo '::error::Select Settings > Pages > Build and deployment > Source > GitHub Actions. Branch publication bypasses this verification.'
            exit 1
          fi
      - run: node ci/build-site.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: .site
  deploy:
    needs: [verify, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - name: Publish the artifact from this verified commit
        id: publication
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

      - name: Verify the published offline entry and commit
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          base = "https://harmony.sysmacom.com.br/"
          expected = os.environ["GITHUB_SHA"]
          def read(path):
              req = urllib.request.Request(base + path + "?verify=" + expected, headers={"Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.read().decode("utf-8")
          for attempt in range(6):
              try:
                  assert json.loads(read("deployment.json"))["commit"] == expected
                  build = re.search(r'const BUILD=(\d+)', read("sw.js")).group(1)
                  assert 'data-harmony-build="' + build + '"' in read("offline.html")
                  assert "app.html" in read("offline-entry.js")
                  config = json.loads(re.search(r'Object.freeze\((\{.*\})\)', read("config.js")).group(1))
                  assert config["supabaseUrl"] == "https://xrwvszghwijgagarfcnf.supabase.co"
                  for path in ["app.html", "login.html", "offline.html", "index.html", "local.html"]:
                      html = read(path)
                      assert "xrwvszghwijgagarfcnf.supabase.co" in html
                      assert "fcmsojjtkiehsobbkjnr.supabase.co" not in html
                  request = urllib.request.Request(config["supabaseUrl"] + "/auth/v1/health", headers={"apikey": config["supabaseKey"]})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      assert response.status == 200
                  print(json.dumps({"commit": expected, "offline_entry_published": True}))
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(5)
          PY
